[project]
name = "vitae"
version = "0.1.0"
description = "Vitae - personal health agent API (FastAPI)"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "brian-rey-development", email = "brianrey3@gmail.com" }
]
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ty.environment]
root = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "unit: fast tests with no I/O (domain and application via fakes)",
    "integration: tests that exercise the ASGI app against a real database",
]
