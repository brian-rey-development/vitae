[project]
name = "vitae"
version = "0.1.0"
description = "Vitae - personal health agent API (FastAPI)"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "brian-rey-development", email = "brianrey3@gmail.com" }
]
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.73",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ty.environment]
root = ["src"]
